set-option -g default-command "zsh -l"

#set -g default-terminal "screen-256color"
#set -ag terminal-overrides ",xterm-256color:RGB"

set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'

set -g mouse on
set -s set-clipboard on
setw -g mode-keys vi


set -g @plugin 'nordtheme/tmux'

#set -g window-style 'bg=#343a44'
#set -g window-active-style 'bg=#262a32'

set -g window-style 'bg=#192a32,fg=#606878'
set -g window-active-style 'bg=#112a32,fg=#c8ccd4'
set -g pane-border-style 'fg=#3a3f4a'
set -g pane-active-border-style 'fg=#5a7a5a'

run '~/.tmux/plugins/tpm/tpm'

bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n M-d split-window -v -c "#{pane_current_path}"

# Navigation (Alt+arrows via user-keys for Ghostty)
set -s user-keys[0] "\e[1;3A"
set -s user-keys[1] "\e[1;3B"
set -s user-keys[2] "\e[1;3C"
set -s user-keys[3] "\e[1;3D"

bind -n User0 select-pane -U
bind -n User1 select-pane -D
bind -n User2 select-pane -R
bind -n User3 select-pane -L

# Alt+h/j/k/l as fallback
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R


